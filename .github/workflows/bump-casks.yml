name: Bump Casks

on:
  schedule:
    - cron: "0 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-casks:
    runs-on: macos-latest

    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Configure Git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Fresh clone tap
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
        run: |
          brew untap leeronr/dedeprecated 2>/dev/null || true

          brew tap leeronr/dedeprecated \
            https://github.com/leeronr/homebrew-dedeprecated.git

          TAP_PATH="$(brew --repository leeronr/dedeprecated)"

          echo "=== Tap path ==="
          echo "$TAP_PATH"

          echo "=== Git remotes ==="
          git -C "$TAP_PATH" remote -v

          echo "=== Push URL ==="
          git -C "$TAP_PATH" remote get-url --push origin

          echo "=== Homebrew tap remote ==="
          brew tap-info leeronr/dedeprecated

          EXPECTED="https://github.com/leeronr/homebrew-dedeprecated.git"
          ACTUAL="$(git -C "$TAP_PATH" remote get-url --push origin)"

          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::Unexpected push URL: $ACTUAL"
            exit 1
          fi

      - name: Bump casks
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
          HOMEBREW_NO_INSTALL_FROM_API: "1"
        run: |
          brew bump \
            --no-fork \
            --open-pr \
            --casks \
            --tap=leeronr/dedeprecated

      - name: Auto-merge bump PRs
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
        run: |
          prs="$(gh pr list \
            --repo "${{ github.repository }}" \
            --state open \
            --author "app/github-actions" \
            --json number,title,body \
            --jq '.[] | select(.body | contains("Created by `brew bump`")) | .number')"

          if [[ -z "$prs" ]]; then
            echo "No new bump PRs found."
            exit 0
          fi

          while IFS= read -r pr; do
            [[ -z "$pr" ]] && continue

            echo "Enabling auto-merge for PR #$pr"

            gh pr merge "$pr" \
              --repo "${{ github.repository }}" \
              --auto \
              --squash \
              --delete-branch
          done <<< "$prs"
