name: Bump Casks

on:
  schedule:
    - cron: "0 2,14 * * *"
  push:
    paths:
      - ".github/workflows/bump-casks.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: Bump outdated casks
    runs-on: macos-latest

    steps:
      - name: Update Homebrew
        run: brew update

      - name: Bump casks
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
        run: |
          brew bump \
            --cask \
            --tap=leeronr/homebrew-dedeprecated \
            --no-fork \
            --open-pr

  merge:
    name: Auto-merge bump PRs
    runs-on: ubuntu-latest
    needs: bump

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Auto-merge Homebrew bump PRs
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
        run: |
          set -euo pipefail

          prs="$(
            gh pr list \
              --repo "${{ github.repository }}" \
              --state open \
              --search 'Created by `brew bump` in:body' \
              --json number \
              --jq '.[].number'
          )"

          if [[ -z "$prs" ]]; then
            echo "No Homebrew bump PRs to merge."
            exit 0
          fi

          while IFS= read -r pr; do
            [[ -z "$pr" ]] && continue

            echo "Enabling auto-merge for PR #$pr"

            gh pr merge "$pr" \
              --repo "${{ github.repository }}" \
              --auto \
              --squash \
              --delete-branch
          done <<< "$prs"
