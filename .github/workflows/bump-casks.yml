name: Bump Casks

on:
  schedule:
    - cron: "0 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-casks:
    runs-on: macos-latest

    steps:
      - name: Configure Git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Tap repository
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
        run: |
          brew tap leeronr/dedeprecated

      - name: Bump casks
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
        run: |
          declare -A version
          declare -A version_arm
          declare -A version_intel

          package=
          skip=0
          multi=0

          while IFS= read -r line; do

              # New package
              if [[ $line == '==> '* ]]; then

                  # "==> foo is up to date!"
                  if [[ $line == *' is up to date!' ]]; then
                      package=
                      skip=1
                      multi=0
                      continue
                  fi

                  package=${line#==> }
                  skip=0
                  multi=0
                  continue
              fi

              (( skip )) && continue

              # Latest version: ARM/Intel
              if [[ $line == 'Latest livecheck version: arm:'* ]]; then
                  multi=1

                  value=${line#*arm:}
                  value=${value#"${value%%[![:space:]]*}"}

                  version_arm["$package"]="$value"
                  continue
              fi

              # Intel continuation
              if (( multi )) && [[ $line == *'intel:'* ]]; then

                  value=${line#*intel:}
                  value=${value#"${value%%[![:space:]]*}"}

                  version_intel["$package"]="$value"
                  continue
              fi

              # Latest version: single version
              if [[ $line == 'Latest livecheck version:'* ]]; then

                  value=${line#Latest livecheck version:}
                  value=${value#"${value%%[![:space:]]*}"}

                  version["$package"]="$value"
                  continue
              fi

          done < <(brew bump --tap leeronr/dedeprecated)

          echo "=== Single-version casks ==="

          for package in "${!version[@]}"; do

              echo "Bumping $package -> ${version[$package]}"

              brew bump-cask-pr \
                  --no-fork \
                  --version "${version[$package]}" \
                  "leeronr/dedeprecated/$package"

          done

          echo "=== Multi-architecture casks ==="

          for package in "${!version_arm[@]}"; do

              echo "Bumping $package:"
              echo "  arm:   ${version_arm[$package]}"
              echo "  intel: ${version_intel[$package]}"

              brew bump-cask-pr \
                  --no-fork \
                  --no-browse \
                  --version-arm "${version_arm[$package]}" \
                  --version-intel "${version_intel[$package]}" \
                  "leeronr/dedeprecated/$package"

          done

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
        run: |
          echo "Looking for bump PRs..."

          gh pr list \
            --repo "${{ github.repository }}" \
            --state open \
            --json number,title,url \
            --jq '.[] | "\(.number)\t\(.title)\t\(.url)"'

          prs="$(
            gh pr list \
              --repo "${{ github.repository }}" \
              --state open \
              --json number,title \
              --jq '.[] | select(.title | startswith("Bump ")) | .number'
          )"

          if [[ -z "$prs" ]]; then
              echo "No open bump PRs found."
              exit 0
          fi

          while IFS= read -r pr; do
              [[ -z "$pr" ]] && continue

              echo "Enabling auto-merge for PR #$pr"

              gh pr merge "$pr" \
                  --repo "${{ github.repository }}" \
                  --auto \
                  --squash \
                  --delete-branch

          done <<< "$prs"

