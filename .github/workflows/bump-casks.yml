name: Bump Casks

on:
  schedule:
    - cron: "0 2,14 * * *"
  push:
    paths:
      - ".github/workflows/bump-casks.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-casks:
    runs-on: macos-latest
    steps:
      - name: Configure Git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
      
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Tap repository
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
        run: |
          brew tap leeronr/dedeprecated

      - name: Install Python
        run: brew install python

      - name: Bump casks
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
        run: |
          python3 .github/scripts/bump_casks.py

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
        run: |
          echo "Looking for bump PRs..."

          gh pr list \
            --repo "${{ github.repository }}" \
            --state open \
            --json number,title,url \
            --jq '.[] | "\(.number)\t\(.title)\t\(.url)"'

          prs="$(
            gh pr list \
              --repo "${{ github.repository }}" \
              --state open \
              --json number,title \
              --jq '.[] | select(.title | startswith("Bump ")) | .number'
          )"

          if [[ -z "$prs" ]]; then
              echo "No open bump PRs found."
              exit 0
          fi

          while IFS= read -r pr; do
              [[ -z "$pr" ]] && continue

              echo "Enabling auto-merge for PR #$pr"

              gh pr merge "$pr" \
                  --repo "${{ github.repository }}" \
                  --auto \
                  --squash \
                  --delete-branch

          done <<< "$prs"
