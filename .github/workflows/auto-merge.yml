name: Auto-merge PRs

on:
  schedule:
    - cron: "5 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
        run: |
          echo "Looking for open PRs authored by leeronr..."

          gh pr list \
            --repo "${{ github.repository }}" \
            --author leeronr \
            --state open \
            --json number,title,url \
            --jq '.[] | "\(.number)\t\(.title)\t\(.url)"'

          prs="$(
            gh pr list \
              --repo "${{ github.repository }}" \
              --state open \
              --author leeronr \
              --json number \
              --jq '.[].number'
          )"

          if [[ -z "$prs" ]]; then
            echo "No open bump PRs found."
            exit 0
          fi

          while IFS= read -r pr; do
            [[ -z "$pr" ]] && continue

            echo "Enabling auto-merge for PR #$pr"

            gh pr merge "$pr" \
                --repo "${{ github.repository }}" \
                --squash \
                --delete-branch

          done <<< "$prs"